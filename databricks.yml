    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-15e61da2-fb6a.cloud.databricks.com
    variables:
      catalog: datalake_emendas
      schema: bronze
  prod:
    mode: production
    workspace:
      host: https://dbc-15e61da2-fb6a.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/gbarbos4@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/gbarbos4@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: datalake_emendas
      schema: bronze
    permissions:
      - user_name: gbarbos4@gmail.com
        level: CAN_MANAGE
