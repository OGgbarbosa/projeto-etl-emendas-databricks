# The main pipeline for etl_emendas_parlamentares

resources:
  pipelines:
    etl_emendas_parlamentares_etl:
      name: etl_emendas_parlamentares_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/etl_emendas_parlamentares_etl"

      libraries:
        - glob:
            include: ../src/etl_emendas_parlamentares_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
